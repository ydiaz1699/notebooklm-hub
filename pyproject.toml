[project]
name = "notebooklm-hub"
version = "0.0.0"
description = "Acceso programático propio y duradero a Google NotebookLM para cualquier LLM y para n8n (MCP + REST + CLI sobre un núcleo único)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ydiaz1699" }]
keywords = ["notebooklm", "mcp", "rest", "n8n", "gemini", "llm"]
dependencies = [
    # El núcleo + transporte web no necesita frameworks de fachada.
    "httpx>=0.27",
]

[project.optional-dependencies]
mcp = ["fastmcp>=2.0"]
rest = ["fastapi>=0.110", "uvicorn>=0.29"]
cli = ["typer>=0.12"]
browser = ["playwright>=1.44"]   # transporte nivel 3 (fallback)
grpc = ["grpcio>=1.60", "protobuf>=4.25"]  # transporte nivel 1 (Android)
all = ["notebooklm-hub[mcp,rest,cli,browser,grpc]"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.4"]

[project.scripts]
nlmhub-mcp = "notebooklm_hub.facades.mcp_server:main"
nlmhub-rest = "notebooklm_hub.facades.rest_api:main"
# nlmhub = "notebooklm_hub.facades.cli:main"   # Fase 4

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notebooklm_hub"]

[tool.ruff]
line-length = 100
target-version = "py310"
